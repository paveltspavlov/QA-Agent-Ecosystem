[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-ecosystem"
version = "2.0.0"
description = "QA Agent Ecosystem — 18 specialized AI-powered QA agents with Playwright test automation, orchestrated by a Test Manager, built on GitHub Copilot SDK"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk>=0.1.0"]
anthropic = ["anthropic>=0.40.0"]
claude = ["claude-agent-sdk>=0.1.48"]
openai = ["openai>=1.0"]
all = [
    "github-copilot-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.48",
    "openai>=1.0",
]

[project.scripts]
qa-agent = "qa_ecosystem.cli:main"

[tool.setuptools.packages.find]
include = ["qa_ecosystem*"]

[tool.setuptools.package-data]
qa_ecosystem = ["models.yaml", "templates/*.yaml"]
