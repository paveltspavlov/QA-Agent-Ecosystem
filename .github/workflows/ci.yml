name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint with ruff
        run: ruff check qa_ecosystem/ tests/

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate models.yaml and agent registry
        run: |
          python -c "
          from qa_ecosystem.models import list_profiles, list_roles
          profiles = list_profiles()
          roles = list_roles()
          print(f'Profiles: {len(profiles)}')
          print(f'Roles: {roles}')
          for role, profile_name in roles.items():
              assert profile_name in profiles, f'Role {role} points to unknown profile {profile_name}'
          print('models.yaml: OK')
          "
          python -c "
          from qa_ecosystem.agents import list_agents
          from qa_ecosystem.config import AGENT_NAMES
          agents = list_agents()
          assert len(agents) == len(AGENT_NAMES), f'Registry has {len(agents)} agents but config has {len(AGENT_NAMES)}'
          for name in AGENT_NAMES:
              assert name in agents, f'Agent {name} missing from registry'
          print(f'Agent registry: {len(agents)} agents OK')
          "
